# Graph-enhanced Hybrid RAG variant (train study): graph ranking + routed BM25 (+ global dense) fused with RRF, optional reranking.
name: gh_graph_bm25_rerank

data:
  corpus_root: data/raw/corpus
  document_manifest: data/processed/document_manifest.json

chunking:
  strategy: sentence
  chunk_size: 800
  chunk_overlap: 0

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2   # 384-dim, 256-token limit, fast on CPU
  normalize_whitespace: true   # collapse runs of spaces in the text sent to the model only
  query_prefix: ""
  passage_prefix: ""
  batch_size: 64
  device: cpu

index:
  output_root: artifacts/indexes   # git-ignored; one subfolder per index fingerprint

retrieval:
  pipeline: graph_hybrid
  top_k: 10
  # Calibrated on train only (python -m contract_intelligence.retrieval.calibrate):
  # maximises balanced accuracy of the top-1 graph score, answerable vs unanswerable.
  abstain_threshold: 0.5214

graph:
  output_root: artifacts/graphs
  route_contracts: true
  route_min_score: 3.0
  route_keep_ratio: 0.5
  question_only: true
  section_title_weight: 0.3
  expand_top: 5
  expansion_decay: 0.9

hybrid:
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_query: question
  dense_query: full
  dense_pool: 50
  bm25_pool: 50
  graph_pool: 50
  rrf_k: 60
  graph_weight: 1.0
  bm25_weight: 1.0
  dense_weight: 0.0
  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  rerank_pool: 40
  rerank_query: question
  rerank_batch_size: 8
