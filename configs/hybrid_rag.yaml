# Hybrid RAG: BM25 (full query) + dense FAISS (full query) fused with RRF, top 40 reranked by a cross-encoder on the question only. Best hybrid variant on train (experiments/hybrid_rag_study.md).
name: hybrid_rag

data:
  corpus_root: data/raw/corpus
  document_manifest: data/processed/document_manifest.json

chunking:
  strategy: sentence
  chunk_size: 800
  chunk_overlap: 0

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2   # 384-dim, 256-token limit, fast on CPU
  normalize_whitespace: true   # collapse runs of spaces in the text sent to the model only
  query_prefix: ""
  passage_prefix: ""
  batch_size: 64
  device: cpu

index:
  output_root: artifacts/indexes   # git-ignored; one subfolder per index fingerprint

retrieval:
  pipeline: hybrid
  top_k: 10
  # Calibrated on train only (python -m contract_intelligence.retrieval.calibrate):
  # maximises balanced accuracy of the top-1 cross-encoder logit, answerable vs unanswerable.
  abstain_threshold: 1.5354

hybrid:
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_query: full
  dense_query: full
  dense_pool: 50
  bm25_pool: 50
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 1.0
  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  rerank_pool: 40
  rerank_query: question
  rerank_batch_size: 32
