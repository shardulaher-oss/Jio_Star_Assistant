name: loop_00_reference_baseline
data:
  corpus_root: data/raw/corpus
  document_manifest: data/processed/document_manifest.json
chunking:
  strategy: fixed
  chunk_size: 500
  chunk_overlap: 0
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize_whitespace: true
  query_prefix: ''
  passage_prefix: ''
  batch_size: 64
  device: cpu
index:
  output_root: artifacts/indexes
retrieval:
  top_k: 10
  abstain_threshold: 0.6085
