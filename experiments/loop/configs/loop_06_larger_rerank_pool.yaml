name: loop_06_larger_rerank_pool
data:
  corpus_root: data/raw/corpus
  document_manifest: data/processed/document_manifest.json
chunking:
  strategy: sentence
  chunk_size: 800
  chunk_overlap: 0
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize_whitespace: true
  query_prefix: ''
  passage_prefix: ''
  batch_size: 64
  device: cpu
index:
  output_root: artifacts/indexes
retrieval:
  pipeline: graph_hybrid
  top_k: 10
  abstain_threshold: -5.6523
graph:
  output_root: artifacts/graphs
  route_contracts: true
  route_min_score: 3.0
  route_keep_ratio: 0.5
  question_only: true
  section_title_weight: 0.3
  expand_top: 5
  expansion_decay: 0.9
hybrid:
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_query: question
  dense_query: full
  dense_pool: 50
  bm25_pool: 50
  graph_pool: 50
  rrf_k: 60
  graph_weight: 1.0
  bm25_weight: 1.0
  dense_weight: 0.0
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  rerank_pool: 80
  rerank_query: question
  rerank_batch_size: 8
